<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XA Supply Command</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --wine:#641b2e;
  --wine2:#9b304c;
  --dark:#321017;
  --cream:#fff9ed;
  --line:#d8c5a6;
  --muted:#776c67;
  --green:#347457;
  --red:#a93645;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 80% 10%,rgba(153,46,75,.35),transparent 35%),
    linear-gradient(145deg,#351018,#64182d 62%,#851f3c);
}

.hidden{display:none!important}

.screen{
  min-height:100vh;
  padding:24px 18px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  width:min(100%,440px);
  padding:30px 22px;
  border-radius:30px;
  background:var(--cream);
  box-shadow:0 28px 70px rgba(0,0,0,.30);
}

.logo{
  width:84px;
  height:84px;
  margin:0 auto 22px;
  display:grid;
  place-items:center;
  border:3px solid var(--wine);
  border-radius:26px;
  color:var(--wine);
  font:900 40px Georgia,serif;
}

h1{
  margin:0;
  text-align:center;
  color:var(--dark);
  font:900 31px Georgia,serif;
}

.claim{
  margin:11px 0 28px;
  text-align:center;
  color:var(--muted);
  font-size:9px;
  font-weight:900;
  letter-spacing:1.3px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  margin:0 0 6px 3px;
  color:var(--dark);
  font-size:9px;
  font-weight:900;
}

.field input{
  width:100%;
  height:51px;
  padding:0 14px;
  border:1px solid var(--line);
  border-radius:15px;
  background:#fffdf8;
  outline:none;
}

button{
  width:100%;
  min-height:49px;
  border:0;
  border-radius:15px;
  font:900 10px Arial,sans-serif;
  cursor:pointer;
}

.primary{
  color:white;
  background:linear-gradient(135deg,var(--wine),var(--wine2));
}

.forgot{
  margin-top:9px;
  color:var(--wine);
  background:#efe1c8;
}

.status{
  min-height:28px;
  margin-top:14px;
  text-align:center;
  color:var(--red);
  font-size:10px;
  font-weight:800;
  line-height:1.45;
}

.status.ok{color:var(--green)}

#app{
  min-height:100vh;
  padding:20px;
  color:#2c2021;
  background:#f3e8d7;
}

.appbox{
  max-width:700px;
  margin:auto;
}

.appheader{
  padding:18px;
  border-radius:22px;
  color:white;
  background:linear-gradient(135deg,var(--dark),var(--wine));
}

.appheader h2{
  margin:0;
  font:900 28px Georgia,serif;
}

.panel{
  margin-top:12px;
  padding:16px;
  border-radius:18px;
  background:#fffaf1;
}

.logout{
  margin-top:15px;
  background:#a93645;
  color:white;
}
</style>
</head>

<body>

<!-- LOGIN -->

<section class="screen" id="loginScreen">
  <div class="card">

    <div class="logo">XA</div>

    <h1>Supply Command</h1>

    <div class="claim">
      FERMENTED REDRINKS · ONLINE OPERATIONS
    </div>

    <div class="field">
      <label>EMAIL</label>
      <input id="email" type="email" placeholder="Email XA">
    </div>

    <div class="field">
      <label>PASSWORD</label>
      <input id="password" type="password" placeholder="Password">
    </div>

    <button class="primary" onclick="loginXA()">
      ENTRA IN XA
    </button>

    <button class="forgot" onclick="resetXA()">
      PASSWORD DIMENTICATA?
    </button>

    <div class="status" id="loginStatus"></div>

  </div>
</section>


<!-- NUOVA PASSWORD -->

<section class="screen hidden" id="resetScreen">
  <div class="card">

    <div class="logo">XA</div>

    <h1>Nuova password</h1>

    <div class="claim">
      RECUPERO ACCOUNT XA
    </div>

    <div class="field">
      <label>NUOVA PASSWORD</label>
      <input id="newPassword" type="password" minlength="8">
    </div>

    <div class="field">
      <label>RIPETI PASSWORD</label>
      <input id="newPassword2" type="password" minlength="8">
    </div>

    <button class="primary" onclick="saveNewPassword()">
      SALVA NUOVA PASSWORD
    </button>

    <div class="status" id="resetStatus"></div>

  </div>
</section>


<!-- APP -->

<div id="app" class="hidden">

  <div class="appbox">

    <div class="appheader">
      <h2>XA Supply Command</h2>
      <p>Supabase Online</p>
    </div>

    <div class="panel">
      <strong>Accesso effettuato</strong>
      <p id="userEmail"></p>

      <button class="logout" onclick="logoutXA()">
        ESCI DA XA
      </button>
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://dmvdmkfwmvmgggvwqnkz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_yIP9daDD0ICiisUysO74cA_UOhQGNNP";

const APP_URL =
  "https://essenzadiluna1-oss.github.io/xa-supply-command/";

let sb = null;


/* =====================================================
   AVVIO
===================================================== */

function initSupabase(){

  const status =
    document.getElementById("loginStatus");

  try{

    if(
      !window.supabase ||
      !window.supabase.createClient
    ){

      status.textContent =
        "ERRORE: libreria Supabase non caricata.";

      return false;
    }


    sb =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:true
          }
        }
      );


    return true;

  }catch(error){

    console.error(error);

    status.textContent =
      "ERRORE AVVIO: " +
      error.message;

    return false;
  }
}


/* =====================================================
   LOGIN
===================================================== */

async function loginXA(){

  const status =
    document.getElementById("loginStatus");

  status.classList.remove("ok");


  if(!sb){

    status.textContent =
      "Supabase non inizializzato.";

    return;
  }


  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  if(!email){

    status.textContent =
      "Inserisci l'email.";

    return;
  }


  if(!password){

    status.textContent =
      "Inserisci la password.";

    return;
  }


  status.textContent =
    "Accesso in corso...";


  const {
    data,
    error
  } =
    await sb.auth.signInWithPassword({
      email,
      password
    });


  if(error){

    console.error(error);

    status.textContent =
      "SUPABASE: " +
      error.message;

    return;
  }


  status.textContent = "";

  showApp(
    data.session
  );
}


/* =====================================================
   PASSWORD DIMENTICATA
===================================================== */

async function resetXA(){

  const status =
    document.getElementById("loginStatus");


  status.classList.remove("ok");


  /*
    Questo messaggio deve comparire SUBITO.
    Se non compare significa che il bottone
    non sta eseguendo JavaScript.
  */

  status.textContent =
    "Pulsante attivo. Controllo email...";


  if(!sb){

    status.textContent =
      "ERRORE: Supabase non inizializzato.";

    return;
  }


  const email =
    document.getElementById("email").value.trim();


  if(!email){

    status.textContent =
      "Inserisci prima l'email.";

    document.getElementById("email").focus();

    return;
  }


  status.textContent =
    "Invio richiesta a Supabase...";


  try{

    const {
      data,
      error
    } =
      await sb.auth.resetPasswordForEmail(
        email,
        {
          redirectTo:APP_URL
        }
      );


    console.log(
      "XA RESET DATA:",
      data
    );


    if(error){

      console.error(
        "XA RESET ERROR:",
        error
      );


      status.textContent =
        "SUPABASE: " +
        (
          error.message ||
          JSON.stringify(error)
        );

      return;
    }


    status.classList.add("ok");

    status.textContent =
      "EMAIL INVIATA ✓ Apri soltanto l'ultima email ricevuta.";


  }catch(error){

    console.error(error);


    status.textContent =
      "ERRORE JAVASCRIPT: " +
      error.message;
  }
}


/* =====================================================
   RECUPERO PASSWORD DAL LINK EMAIL
===================================================== */

sbAuthRecoveryListener = function(){

  if(!sb){
    return;
  }


  sb.auth.onAuthStateChange(
    (event,session)=>{

      console.log(
        "XA AUTH EVENT:",
        event
      );


      if(
        event === "PASSWORD_RECOVERY"
      ){

        document
          .getElementById("loginScreen")
          .classList.add("hidden");

        document
          .getElementById("app")
          .classList.add("hidden");

        document
          .getElementById("resetScreen")
          .classList.remove("hidden");

        return;
      }


      if(
        event === "SIGNED_IN" &&
        session
      ){

        const hash =
          new URLSearchParams(
            location.hash.substring(1)
          );


        if(
          hash.get("type") === "recovery"
        ){

          document
            .getElementById("loginScreen")
            .classList.add("hidden");

          document
            .getElementById("app")
            .classList.add("hidden");

          document
            .getElementById("resetScreen")
            .classList.remove("hidden");

          return;
        }
      }
    }
  );
};


/* =====================================================
   SALVA NUOVA PASSWORD
===================================================== */

async function saveNewPassword(){

  const status =
    document.getElementById("resetStatus");


  status.classList.remove("ok");


  const p1 =
    document.getElementById("newPassword").value;

  const p2 =
    document.getElementById("newPassword2").value;


  if(p1.length < 8){

    status.textContent =
      "La password deve avere almeno 8 caratteri.";

    return;
  }


  if(p1 !== p2){

    status.textContent =
      "Le password non coincidono.";

    return;
  }


  status.textContent =
    "Salvataggio...";


  const {
    error
  } =
    await sb.auth.updateUser({
      password:p1
    });


  if(error){

    console.error(error);

    status.textContent =
      "SUPABASE: " +
      error.message;

    return;
  }


  status.classList.add("ok");

  status.textContent =
    "PASSWORD CAMBIATA ✓";


  setTimeout(
    async ()=>{

      await sb.auth.signOut();

      window.history.replaceState(
        {},
        document.title,
        APP_URL
      );


      document
        .getElementById("resetScreen")
        .classList.add("hidden");


      document
        .getElementById("loginScreen")
        .classList.remove("hidden");


      document
        .getElementById("password")
        .value = "";


      document
        .getElementById("loginStatus")
        .classList.add("ok");


      document
        .getElementById("loginStatus")
        .textContent =
        "Nuova password salvata. Ora entra in XA.";

    },
    1000
  );
}


/* =====================================================
   APP
===================================================== */

function showApp(session){

  document
    .getElementById("loginScreen")
    .classList.add("hidden");

  document
    .getElementById("resetScreen")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");


  document
    .getElementById("userEmail")
    .textContent =
    session?.user?.email || "";
}


async function logoutXA(){

  await sb.auth.signOut();

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("loginScreen")
    .classList.remove("hidden");
}


/* =====================================================
   SESSIONE INIZIALE
===================================================== */

async function bootXA(){

  if(
    !initSupabase()
  ){
    return;
  }


  sbAuthRecoveryListener();


  /*
    Diamo a Supabase il tempo di leggere
    eventuali token presenti nell'URL.
  */

  await new Promise(
    resolve =>
      setTimeout(resolve,400)
  );


  const {
    data:{
      session
    }
  } =
    await sb.auth.getSession();


  const hash =
    new URLSearchParams(
      location.hash.substring(1)
    );


  if(
    session &&
    hash.get("type") === "recovery"
  ){

    document
      .getElementById("loginScreen")
      .classList.add("hidden");

    document
      .getElementById("resetScreen")
      .classList.remove("hidden");

    return;
  }


  if(session){

    showApp(session);
  }
}


bootXA();

</script>

</body>
</html>
